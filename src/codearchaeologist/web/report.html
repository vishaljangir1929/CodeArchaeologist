<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeArchaeologist report</title>
<style>body{font:15px/1.6 system-ui;margin:0;background:#f4f3ee;color:#172a32}header{background:#142c32;color:white;padding:30px}main{max-width:1150px;margin:24px auto;padding:0 24px}h1{margin:0}input,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:6px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;background:#172a32;color:#e2f2eb;padding:24px;overflow:auto}img{max-width:100%;background:white}a{color:#08695f}.metrics{display:flex;gap:12px;flex-wrap:wrap}.metric{padding:20px;background:white;border:1px solid #ddd;min-width:120px}.metric strong{display:block;font-size:28px}</style></head>
<body><header><h1>CodeArchaeologist</h1><div id="name"></div></header><main><div class="metrics" id="metrics"></div><p>Static findings are estimates. Unused symbols need human review; dynamic calls may remain unresolved.</p><h2>Source inventory</h2><input id="filter" aria-label="Filter symbols" placeholder="Filter by symbol, file, or call"><div id="symbols"></div><h2>Architecture</h2><img src="architecture.svg" alt="Module dependencies"><h2>Call graph</h2><img src="call_graph.svg" alt="Resolved function calls"><details><summary>Raw analysis JSON</summary><pre id="raw"></pre></details></main>
<script id="report-data" type="application/json">__ANALYSIS_DATA__</script><script>
const report=JSON.parse(document.querySelector('#report-data').textContent);
document.querySelector('#name').textContent=report.project.name;
for(const key of ['modules','functions','classes','lines_of_code','call_edges','unresolved_calls']){const card=document.createElement('div');card.className='metric';card.textContent=key.replaceAll('_',' ');const strong=document.createElement('strong');strong.textContent=report.summary[key]??0;card.append(strong);document.querySelector('#metrics').append(card)}
function render(){const table=document.createElement('table'),head=document.createElement('tr');for(const label of ['Symbol','File','Complexity','Calls']){const th=document.createElement('th');th.textContent=label;head.append(th)}table.append(head);for(const item of report.functions.filter(item=>JSON.stringify(item).toLowerCase().includes(document.querySelector('#filter').value.toLowerCase()))){const row=document.createElement('tr');for(const value of [item.qualified_name,item.file+':'+item.line_start,item.complexity,item.calls.join(', ')]){const td=document.createElement('td');td.textContent=value;row.append(td)}table.append(row)}document.querySelector('#symbols').replaceChildren(table)}document.querySelector('#filter').addEventListener('input',render);document.querySelector('#raw').textContent=JSON.stringify(report,null,2);render();
</script></body></html>
