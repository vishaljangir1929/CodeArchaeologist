name: Feature proposal
description: Propose a focused addition with an observable outcome.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the current workflow and why it needs to change.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed behavior and evaluation
      description: Describe the desired result and how to verify that it helps.
    validations:
      required: true
